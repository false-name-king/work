<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png">
    <title>工作统计</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-secondary: #8E8E93;
            --accent-blue: #007AFF;
            --danger-red: #FF3B30;
            --border-color: #E5E5EA;
            --input-bg: #F2F2F7;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            min-width: 375px; 
            display: flex;
            justify-content: center;
            padding: 16px 12px;
            padding-bottom: 40px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
        }

        .config-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .label {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .date-input {
            flex: 1;
            background: var(--input-bg);
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
            appearance: none;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .member-count {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .manage-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 0 4px 8px;
        }

        .manage-btn:active { opacity: 0.6; }

        .member-list {
            display: flex;
            flex-direction: column;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0;
        }

        .member-item {
            background: var(--card-bg);
            padding: 16px 12px;
            display: flex;
            align-items: center; 
            gap: 12px;
            transition: opacity 0.3s var(--ease), transform 0.3s var(--ease), height 0.3s var(--ease), padding 0.3s var(--ease), margin 0.3s var(--ease);
            overflow: hidden;
            margin-bottom: 1px;
            position: relative;
        }
        
        .member-item:last-child { margin-bottom: 0; }

        .member-item.removing {
            opacity: 0 !important;
            transform: scale(0.95) translateX(-10px) !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-bottom: 0 !important;
            height: 0 !important;
            border: none !important;
        }

        .item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px; 
            overflow: hidden;
        }

        .row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            overflow: hidden;
            min-width: 150px;
        }

        .row-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between; 
            flex-wrap: wrap;
            gap: 12px;
            transition: all 0.3s var(--ease);
        }
        
        .prod-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ot-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .member-name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-left: 2px;
            flex: 1;
        }

        .ui-base {
            background: var(--input-bg);
            border: none;
            border-radius: 6px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        select.ui-base {
            background-image: none;
        }

        .ui-select-center {
            text-align: center;
            text-align-last: center; 
            font-weight: 600;
            color: var(--accent-blue);
        }

        .ui-select-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            padding: 4px 8px;
            text-align: center;
            text-align-last: center;
        }

        .machine-input { 
            width: 44px; 
            padding: 4px 0; 
            font-size: 14px; 
            color: var(--text-main);
        }
        
        .role-select {
            background: var(--input-bg);
        }

        /* 统一分段控制器样式 (保留用于加班开关) */
        .toggle-group {
            display: flex;
            background: #E5E5EA;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            padding: 4px 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .toggle-btn.active {
            background: #FFFFFF;
            color: var(--text-main);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            border-radius: 6px;
            font-weight: 600;
        }
        
        .num-select { 
            width: 50px; 
            padding: 4px 0; 
            font-size: 15px;
            cursor: pointer;
        }
        
        .unit-text { 
            color: var(--text-secondary); 
            font-size: 13px; 
            font-weight: 500; 
        }

        .time-module { 
            display: flex; 
            align-items: center; 
            background: var(--input-bg); 
            border-radius: 8px; 
            padding: 4px 8px; 
            gap: 4px; 
            transition: all 0.3s var(--ease);
        }
        
        .time-input { 
            width: 46px; 
            padding: 0; 
            background: transparent; 
            font-size: 14px;
            color: var(--accent-blue);
            font-weight: 600;
            text-align: center;
            border: none;
            outline: none;
        }
        .time-input::-webkit-calendar-picker-indicator { display: none; }
        .time-separator { color: var(--text-secondary); font-size: 14px; font-weight: 500; margin: 0 2px;}

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-red);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.4s var(--spring);
            width: 0;
            opacity: 0;
            transform: scale(0.5);
            pointer-events: none;
            margin-left: 0;
            flex-shrink: 0;
        }
        .delete-btn:active { transform: scale(0.8) !important; }
        .delete-icon { width: 22px; height: 22px; fill: currentColor; }
        .is-editing .delete-btn {
            width: 28px;
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            margin-left: 4px;
        }

        .add-member-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            margin-top: 0;
            transition: all 0.4s var(--spring);
            pointer-events: none;
        }
        .add-member-inner { overflow: hidden; }
        .is-editing .add-member-wrapper {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 16px;
            pointer-events: auto;
        }
        .add-member-form { display: flex; gap: 10px; padding-bottom: 2px; }
        .add-input { flex: 1; background: var(--input-bg); border: none; border-radius: 10px; padding: 12px 14px; font-size: 15px; outline: none; }
        .add-btn { background: var(--accent-blue); color: white; border: none; border-radius: 10px; padding: 0 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .add-btn:active { opacity: 0.8; }

        .preview-card { background: #1C1C1E; color: #FFFFFF; }
        .preview-content {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 16px;
            opacity: 0.9;
            min-height: 80px;
        }
        
        .copy-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .copy-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .copy-btn:active { background: rgba(255, 255, 255, 0.25); }
        .copy-btn.success { background: #34C759; }

        .copy-all-btn {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .copy-all-btn:active { background: #0056b3; }
        .copy-all-btn.success { background: #34C759; }

        .footer-actions { display: flex; justify-content: center; margin-top: 8px; }
        .clear-data-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 8px 16px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .clear-data-btn:active { color: var(--danger-red); }

        /* Tab Styles */
        .tab-nav {
            display: flex;
            background: #E5E5EA;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #FFFFFF;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .pane {
            display: none;
            width: 100%;
        }

        .pane.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Schedule Specific Styles from work.html (Integrated) */
        .sched-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 1px 6px -1px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
            padding: 24px;
            margin-bottom: 16px;
        }
        .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .cal-title { font-size: 16px; font-weight: 600; color: rgba(0, 0, 0, 0.85); }
        .cal-nav { display: flex; gap: 8px; align-items: center; }
        .cal-nav button { border: 1px solid #d9d9d9; background: #fff; color: rgba(0, 0, 0, 0.65); border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 14px; height: 32px; }
        .cal-nav button:hover { color: #1677ff; border-color: #1677ff; }
        .btn-a { width: 32px; }
        .btn-t { padding: 0 12px; margin-right: 4px; }
        .week { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid #f0f0f0; margin-bottom: 8px; }
        .week span { text-align: center; font-size: 13px; color: rgba(0, 0, 0, 0.45); padding: 8px 0; font-weight: 500; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .d { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 6px; transition: all 0.15s; position: relative; }
        .d.edit { cursor: pointer; }
        .d.edit:hover { background: #e6f4ff !important; box-shadow: inset 0 0 0 1px #1677ff; }
        .d:not(.empty):not(.edit):hover { background: #f0f0f0; }
        .d .n { font-size: 14px; font-weight: 500; color: rgba(0, 0, 0, 0.85); line-height: 1; }
        .d .g { font-size: 9px; margin-top: 3px; font-weight: 400; }
        .d.w { background: #fff7f6; }
        .d.w .n { color: #ff4d4f; }
        .d.w .g { color: #ff7875; }
        .d.o { background: #f8fff6; }
        .d.o .n { color: #52c41a; }
        .d.o .g { color: #73d13d; }
        .d.t { background: #1677ff !important; box-shadow: 0 2px 8px rgba(22, 119, 255, 0.35); }
        .d.t .n { color: #fff !important; }
        .d.t .g { color: rgba(255, 255, 255, 0.8) !important; }
        .d.m::after { content: ''; position: absolute; top: 4px; right: 4px; width: 4px; height: 4px; background-color: #faad14; border-radius: 50%; }
        .d.t.m::after { background-color: #fff; }
        .legend { display: flex; justify-content: center; gap: 24px; margin-top: 16px; padding-top: 12px; border-top: 1px solid #f0f0f0; }
        .legend span { font-size: 12px; color: rgba(0, 0, 0, 0.45); display: flex; align-items: center; gap: 6px; }
        .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
        .lw { background: #fff1f0; border: 1px solid #ffccc7; }
        .lo { background: #f6ffed; border: 1px solid #d9f7be; }
        .set-title { font-size: 16px; font-weight: 600; color: rgba(0, 0, 0, 0.85); margin-bottom: 16px; }
        .set-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .set-row input { height: 36px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 0 12px; font-size: 14px; outline: none; transition: border 0.2s; flex: 1; min-width: 140px; font-family: inherit; }
        .set-row input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); }
        .set-row button { height: 36px; border: none; border-radius: 6px; padding: 0 16px; font-size: 14px; cursor: pointer; font-weight: 500; transition: all 0.2s; white-space: nowrap; }
        .btn-work { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .btn-work:hover { background: #ff4d4f; color: #fff; }
        .btn-off { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .btn-off:hover { background: #52c41a; color: #fff; }
        .btn-group-sched { display: flex; gap: 12px; margin-top: 16px; }
        .btn-clear-sched { flex: 1; height: 40px; border: 1px solid #d9d9d9; background: #fff; color: rgba(0, 0, 0, 0.65); border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; font-family: inherit; }
        .btn-clear-sched:hover { color: #ff4d4f; border-color: #ff4d4f; }
        .msg-sched { font-size: 13px; color: rgba(0, 0, 0, 0.35); margin-top: 12px; padding: 8px 12px; background: #fafafa; border-radius: 6px; display: none; }
        .msg-sched.show { display: block; }
        .msg-sched.ok { color: #389e0d; background: #f6ffed; }
        .msg-sched.err { color: #cf1322; background: #fff1f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-nav">
        <button class="tab-btn active" id="tab-statsPane" onclick="switchTab('statsPane')">工作统计</button>
        <button class="tab-btn" id="tab-schedPane" onclick="switchTab('schedPane')">工作排期</button>
    </div>

    <div id="statsPane" class="pane active">
        <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
            <div class="config-row">
                <span class="label" style="width: 60px;">日期</span>
                <input type="text" id="dateInput" class="date-input">
            </div>
            <div class="config-row">
                <span class="label" style="width: 60px;">产量备注</span>
                <input type="text" id="prodNoteInput" class="date-input" placeholder="例如：无">
            </div>
        </div>

        <div class="card" id="memberSection">
            <div class="section-header">
                <h2>人员综合管理</h2>
                <div class="header-actions">
                    <span id="memberCount" class="member-count">0 人</span>
                    <button id="manageBtn" class="manage-btn">管理</button>
                </div>
            </div>
            
            <div class="member-list" id="memberList">
            </div>

            <div class="add-member-wrapper">
                <div class="add-member-inner">
                    <form class="add-member-form" id="addForm">
                        <input type="text" id="newMemberName" class="add-input" placeholder="输入新组员姓名..." autocomplete="off">
                        <button type="submit" class="add-btn">添加</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="card preview-card">
            <div style="color: #8E8E93; font-size: 12px; margin-bottom: 6px; font-weight: 600;">▼ 产量统计预览</div>
            <div class="preview-content" id="previewProd"></div>
            
            <div style="color: #8E8E93; font-size: 12px; margin-bottom: 6px; font-weight: 600; margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px;">▼ 加班时间预览</div>
            <div class="preview-content" id="previewOvertime"></div>
            
            <div class="copy-group">
                <button class="copy-btn" id="copyProdBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    产量
                </button>
                <button class="copy-btn" id="copyOvertimeBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    加班
                </button>
            </div>
            <button class="copy-all-btn" id="copyAllBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                一键复制所有 (合并版)
            </button>
        </div>

        <div class="footer-actions">
            <button id="clearDataBtn" class="clear-data-btn">清除本地数据</button>
        </div>
    </div>

    <div id="schedPane" class="pane">
        <div class="sched-card" id="calendarContainer"></div>
        <div class="sched-card">
            <div class="set-title">设置排班基准</div>
            <div class="set-row">
                <input type="date" id="setDate" />
                <button class="btn-work" onclick="setDay(1)">设为上班</button>
                <button class="btn-off" onclick="setDay(0)">设为休息</button>
            </div>
            <div class="msg-sched" id="msgSched"></div>
        </div>
        <div class="btn-group-sched">
            <button class="btn-clear-sched" onclick="clearCustom()">取消修改日期</button>
            <button class="btn-clear-sched" onclick="clearScheduleData()">清除本地数据</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'work_tracker'; 
    const generateId = () => Math.random().toString(36).substr(2, 9);

    function switchTab(tabId) {
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
        if (tabId === 'schedPane') {
            renderSchedule();
        }
    }

    let options0to999 = '';
    for (let i = 0; i <= 999; i++) {
        options0to999 += `<option value="${i}">${i}</option>`;
    }
    
    let options0to99 = '<option value="">空</option>';
    for (let i = 1; i <= 99; i++) {
        options0to99 += `<option value="${i}">${i}</option>`;
    }

    const DEFAULT_MEMBERS = [
        { id: generateId(), name: '郭书楠', isOT: true, start: '19:00', end: '20:30', machine: '', role: '机长', status: 'normal', batches: 20, pieces: 20 },
        { id: generateId(), name: '严文雅', isOT: true, start: '19:00', end: '20:30', machine: '', role: '组员', status: 'normal', batches: 20, pieces: 20 },
        { id: generateId(), name: '卢从庆', isOT: true, start: '19:00', end: '20:30', machine: '', role: '组员', status: 'normal', batches: 20, pieces: 20 },
        { id: generateId(), name: '杜瑶瑶', isOT: true, start: '19:00', end: '20:30', machine: '', role: '组员', status: 'normal', batches: 20, pieces: 20 },
        { id: generateId(), name: '章屹', isOT: true, start: '19:00', end: '20:30', machine: '', role: '组员', status: 'normal', batches: 20, pieces: 20 }
    ];

    let state = {
        date: '',
        members: [],
        isEditing: false,
        productionNote: '无'
    };

    const elements = {
        dateInput: document.getElementById('dateInput'),
        prodNoteInput: document.getElementById('prodNoteInput'),
        memberSection: document.getElementById('memberSection'),
        memberList: document.getElementById('memberList'),
        addForm: document.getElementById('addForm'),
        newMemberName: document.getElementById('newMemberName'),
        previewProd: document.getElementById('previewProd'),
        previewOvertime: document.getElementById('previewOvertime'),
        copyProdBtn: document.getElementById('copyProdBtn'),
        copyOvertimeBtn: document.getElementById('copyOvertimeBtn'),
        copyAllBtn: document.getElementById('copyAllBtn'),
        memberCount: document.getElementById('memberCount'),
        manageBtn: document.getElementById('manageBtn'),
        clearDataBtn: document.getElementById('clearDataBtn')
    };

    function init() {
        initDate();
        loadData();
        loadSchedule();
        bindEvents();
        renderMembers();
        updatePreview();
        
        const setDateEl = document.getElementById('setDate');
        if (setDateEl) setDateEl.value = fmtKey(SCHED_T);
    }

    function initDate() {
        const today = new Date();
        state.date = `${today.getMonth() + 1}月${today.getDate()}日`;
        elements.dateInput.value = state.date;
    }

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            const data = JSON.parse(stored);
            state.members = data.members || [];
            state.productionNote = data.productionNote || '无';
        } else {
            const oldDataV6 = localStorage.getItem('work_tracker');
            if (oldDataV6) {
                const data = JSON.parse(oldDataV6);
                state.members = data.members || [];
                state.productionNote = data.productionNote || '无';
            } else {
                state.members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
            }
            saveToStorage();
        }
        elements.prodNoteInput.value = state.productionNote;
    }

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            members: state.members,
            productionNote: state.productionNote
        }));
    }

    function debounce(fn, delay = 300) {
        let timer = null;
        return function (...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    const debouncedSaveToStorage = debounce(saveToStorage, 300);
    const debouncedUpdatePreview = debounce(() => updatePreview(), 300);

    function bindEvents() {
        elements.dateInput.addEventListener('input', (e) => { 
            state.date = e.target.value; 
            debouncedUpdatePreview(); 
        });
        elements.prodNoteInput.addEventListener('input', (e) => { 
            state.productionNote = e.target.value; 
            debouncedSaveToStorage();
            debouncedUpdatePreview(); 
        });

        elements.addForm.addEventListener('submit', handleAddMember);
        elements.copyProdBtn.addEventListener('click', () => handleCopy(elements.previewProd.textContent, elements.copyProdBtn));
        elements.copyOvertimeBtn.addEventListener('click', () => handleCopy(elements.previewOvertime.textContent, elements.copyOvertimeBtn));
        elements.copyAllBtn.addEventListener('click', () => {
            const combinedText = elements.previewProd.textContent + '\n\n' + elements.previewOvertime.textContent;
            handleCopy(combinedText, elements.copyAllBtn);
        });
        
        elements.manageBtn.addEventListener('click', toggleManageMode);
        
        elements.memberList.addEventListener('change', handleItemChange);
        elements.memberList.addEventListener('input', handleItemChange);
        elements.memberList.addEventListener('click', handleClicks);
    }

    function toggleManageMode() {
        state.isEditing = !state.isEditing;
        if (state.isEditing) {
            elements.memberSection.classList.add('is-editing');
            elements.manageBtn.textContent = '完成';
            elements.manageBtn.style.fontWeight = '600';
            setTimeout(() => elements.newMemberName.focus(), 300);
        } else {
            elements.memberSection.classList.remove('is-editing');
            elements.manageBtn.textContent = '管理';
            elements.manageBtn.style.fontWeight = '500';
            elements.newMemberName.blur();
        }
    }

    function getSelectHTML(optionsHTML, selectedValue) {
        if (!selectedValue && selectedValue !== 0) return optionsHTML;
        const regex = new RegExp(`value="${selectedValue}"`);
        return optionsHTML.replace(regex, `value="${selectedValue}" selected`);
    }

    function renderMembers() {
        elements.memberList.innerHTML = '';
        state.members.forEach(member => {
            const el = document.createElement('div');
            el.className = 'member-item';
            el.dataset.id = member.id;

            const hideDataRow = member.status === 'leave' ? 'visibility: hidden; opacity: 0;' : '';
            
            const otTimeStyle = member.isOT ? 'opacity: 1; transform: scale(1); pointer-events: auto; max-width: 200px;' : 'opacity: 0; transform: scale(0.9); pointer-events: none; max-width: 0px; margin: 0; padding: 0; border: none;';
            const otBtnNoClass = !member.isOT ? 'active' : '';
            const otBtnYesClass = member.isOT ? 'active' : '';

            const machineOptions = getSelectHTML(options0to99, member.machine);
            const batchesOptions = getSelectHTML(options0to999, member.batches);
            const piecesOptions = getSelectHTML(options0to999, member.pieces);

            // 修改点：将状态切换改为 Select 下拉框，样式与角色选择一致
            el.innerHTML = `
                <div class="item-content">
                    <div class="row-top">
                        <div class="member-info">
                            <select class="ui-base ui-select-center machine-input" data-field="machine">
                                ${machineOptions}
                            </select>
                            <select class="ui-base ui-select-text role-select" data-field="role">
                                <option value="机长" ${member.role === '机长' ? 'selected' : ''}>机长</option>
                                <option value="组员" ${member.role === '组员' ? 'selected' : ''}>组员</option>
                            </select>
                            <!-- 新增：状态选择器，样式同角色 -->
                            <select class="ui-base ui-select-text status-select" data-field="status" style="min-width: 80px;">
                                <option value="normal" ${member.status === 'normal' ? 'selected' : ''}>出勤</option>
                                <option value="leave" ${member.status === 'leave' ? 'selected' : ''}>请假</option>
                                <option value="manual" ${member.status === 'manual' ? 'selected' : ''}>人工</option>
                                <option value="guide" ${member.status === 'guide' ? 'selected' : ''}>引导</option>
                                <option value="gate" ${member.status === 'gate' ? 'selected' : ''}>闸机</option>
                                <option value="inspection" ${member.status === 'inspection' ? 'selected' : ''}>货检</option>
                                <option value="business" ${member.status === 'business' ? 'selected' : ''}>商务</option>
                                <option value="not_entered" ${member.status === 'not_entered' ? 'selected' : ''}>未进岗</option>
                            </select>
                            <span class="member-name">${member.name}</span>
                        </div>
                    </div>
                    <div class="row-bottom" style="${hideDataRow}">
                        <div class="prod-group">
                            <select class="ui-base ui-select-center num-select" data-field="batches">
                                ${batchesOptions}
                            </select>
                            <span class="unit-text">批</span>
                            <select class="ui-base ui-select-center num-select" data-field="pieces">
                                ${piecesOptions}
                            </select>
                            <span class="unit-text">件</span>
                        </div>
                        <div class="ot-group">
                            <div class="toggle-group ot-toggle">
                                <button class="toggle-btn ot-btn ${otBtnNoClass}" data-action="set-ot-false">未加班</button>
                                <button class="toggle-btn ot-btn ${otBtnYesClass}" data-action="set-ot-true">加班</button>
                            </div>
                            <div class="time-module" style="${otTimeStyle}">
                                <input type="time" class="time-input start-time" data-field="start" value="${member.start}">
                                <span class="time-separator">~</span>
                                <input type="time" class="time-input end-time" data-field="end" value="${member.end}">
                            </div>
                        </div>
                    </div>
                </div>
                <button class="delete-btn" aria-label="删除" data-action="delete">
                    <svg class="delete-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" fill="#FF3B30"></circle>
                        <rect x="7" y="11" width="10" height="2" rx="1" fill="white"></rect>
                    </svg>
                </button>
            `;
            elements.memberList.appendChild(el);
        });
        elements.memberCount.textContent = `${state.members.length} 人`;
    }

    function handleItemChange(e) {
        if (!e.target.dataset.field) return; 
        
        const itemEl = e.target.closest('.member-item');
        const id = itemEl.dataset.id;
        const member = state.members.find(m => m.id === id);
        
        if (member) {
            const field = e.target.dataset.field;
            member[field] = e.target.value;
            
            // 如果修改的是状态字段，需要手动更新 UI 显示（隐藏/显示下方数据）
            if (field === 'status') {
                const dataRow = itemEl.querySelector('.row-bottom');
                if (dataRow) {
                    if (member.status === 'leave') {
                        dataRow.style.visibility = 'hidden';
                        dataRow.style.opacity = '0';
                    } else {
                        dataRow.style.visibility = 'visible';
                        dataRow.style.opacity = '1';
                        
                        // 状态切换时更新批数和件数的默认值
                        if (member.status === 'normal') {
                            member.batches = 20;
                            member.pieces = 20;
                        } else {
                            member.batches = 0;
                            member.pieces = 0;
                        }
                        
                        const batchSelect = dataRow.querySelector('select[data-field="batches"]');
                        const pieceSelect = dataRow.querySelector('select[data-field="pieces"]');
                        if (batchSelect) batchSelect.value = member.batches;
                        if (pieceSelect) pieceSelect.value = member.pieces;
                    }
                }
            }

            if (e.type === 'input') {
                debouncedSaveToStorage();
                debouncedUpdatePreview();
            } else {
                saveToStorage();
                updatePreview();
            }
        }
    }

    function handleClicks(e) {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        
        const action = btn.dataset.action;
        const itemEl = btn.closest('.member-item');
        const id = itemEl.dataset.id;
        const index = state.members.findIndex(m => m.id === id);
        if (index === -1) return;

        const member = state.members[index];

        if (action === 'delete') {
            const currentHeight = itemEl.offsetHeight;
            itemEl.style.height = currentHeight + 'px';
            itemEl.offsetHeight; 
            requestAnimationFrame(() => itemEl.classList.add('removing'));
            setTimeout(() => {
                state.members.splice(index, 1);
                saveToStorage();
                itemEl.remove();
                elements.memberCount.textContent = `${state.members.length} 人`;
                updatePreview();
            }, 300);
        } else if (action === 'set-ot-true' || action === 'set-ot-false') {
            const isOT = action === 'set-ot-true';
            member.isOT = isOT;
            
            const otToggleBtns = itemEl.querySelectorAll('.ot-btn');
            otToggleBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const timeModule = itemEl.querySelector('.time-module');
            if (timeModule) {
                if (isOT) {
                    timeModule.style.maxWidth = '200px';
                    timeModule.style.opacity = '1';
                    timeModule.style.transform = 'scale(1)';
                    timeModule.style.pointerEvents = 'auto';
                    timeModule.style.padding = '4px 8px';
                } else {
                    timeModule.style.maxWidth = '0px';
                    timeModule.style.opacity = '0';
                    timeModule.style.transform = 'scale(0.9)';
                    timeModule.style.pointerEvents = 'none';
                    timeModule.style.padding = '0';
                }
            }
            saveToStorage();
            updatePreview();
        }
    }

    function handleAddMember(e) {
        e.preventDefault();
        const nameInput = elements.newMemberName.value.trim();
        if (!nameInput) return;
        
        const newMember = {
            id: generateId(),
            name: nameInput,
            isOT: true,
            start: '19:00',
            end: '20:30',
            machine: '',
            role: '组员',
            status: 'normal',
            batches: 20,
            pieces: 20
        };
        
        state.members.push(newMember);
        saveToStorage();
        elements.newMemberName.value = '';
        
        renderMembers();
        const newEl = elements.memberList.lastElementChild;
        newEl.style.transform = 'translateY(-10px) scale(0.95)';
        newEl.style.opacity = '0';
        
        newEl.offsetHeight;
        requestAnimationFrame(() => {
            newEl.style.transition = 'opacity 0.4s var(--ease), transform 0.4s var(--spring)';
            newEl.style.transform = 'translateY(0) scale(1)';
            newEl.style.opacity = '1';
        });

        updatePreview();
    }

    elements.clearDataBtn.addEventListener('click', () => {
        if (confirm('确定要清除所有本地数据并恢复默认人员名单吗？')) {
            localStorage.removeItem("work_tracker");
            state.members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
            state.productionNote = '无';
            initDate();
            elements.prodNoteInput.value = state.productionNote;
            renderMembers();
            updatePreview();
            if (state.isEditing) toggleManageMode();
        }
    });

    function getDisplayLength(str) {
        let len = 0;
        for (let i = 0; i < str.length; i++) {
            if (str.charCodeAt(i) > 255) len += 2;
            else len += 1;
        }
        return len;
    }

    function updatePreview() {
        const maxNameLength = Math.max(...state.members.map(m => m.name.length), 0);

        let maxMachineLength = 0;
        state.members.forEach(m => {
            const len = getDisplayLength(m.machine || '');
            if (len > maxMachineLength) maxMachineLength = len;
        });

        let maxBatchLength = 0;
        state.members.forEach(m => {
            if (m.status === 'normal') {
                const len = getDisplayLength(String(m.batches) || '0');
                if (len > maxBatchLength) maxBatchLength = len;
            }
        });

        // --- 产量 ---
        let prodContent = `${state.date}\n`;
        let totalBatches = 0;
        let totalPieces = 0;

        state.members.forEach(m => {
            let alignedName = m.name;
            if (m.name.length === 2 && maxNameLength >= 3) {
                const spaces = '　'.repeat(maxNameLength - 2);
                alignedName = m.name[0] + spaces + m.name[1];
            } else if (m.name.length < maxNameLength) {
                alignedName = m.name + '　'.repeat(maxNameLength - m.name.length);
            }

            let machineStr = m.machine || '';
            let currentMacLen = getDisplayLength(machineStr);
            if (currentMacLen < maxMachineLength) {
                machineStr = ' '.repeat(maxMachineLength - currentMacLen) + machineStr;
            }

            if (m.status === 'leave') {
                prodContent += `${machineStr}${m.role}：${alignedName}（请假）\n`;
            } else {
                let batchStr = String(m.batches) || '0';
                let currentBatchLen = getDisplayLength(batchStr);
                if (currentBatchLen < maxBatchLength) {
                    batchStr = ' '.repeat(maxBatchLength - currentBatchLen) + batchStr;
                }

                let statusText = '';
                if (m.status === 'manual') statusText = '（人工）';
                else if (m.status === 'guide') statusText = '（引导）';
                else if (m.status === 'gate') statusText = '（闸机）';
                else if (m.status === 'inspection') statusText = '（货检）';
                else if (m.status === 'business') statusText = '（商务）';
                else if (m.status === 'not_entered') statusText = '（未进岗）';

                prodContent += `${machineStr}${m.role}：${alignedName}${batchStr}批${m.pieces}件${statusText}\n`;
                totalBatches += parseInt(m.batches) || 0;
                totalPieces += parseInt(m.pieces) || 0;
            }
        });

        prodContent += `合计：${totalBatches}批${totalPieces}件\n`;
        const noteText = state.productionNote.trim() || '无';
        prodContent += `大批量/奖励情况：${noteText}`;
        
        elements.previewProd.textContent = prodContent;


        // --- 加班 ---
        let otMembers = state.members.filter(m => m.status !== 'leave' && m.isOT);
        let otContent = '';
        
        if (otMembers.length === 0) {
            otContent = `${state.date}加班时间\n今日全员无加班`;
        } else {
            otContent = `${state.date}加班时间\n`;
            otMembers.forEach(m => {
                let alignedName = m.name;
                if (m.name.length === 2 && maxNameLength >= 3) {
                    const spaces = '　'.repeat(maxNameLength - 2);
                    alignedName = m.name[0] + spaces + m.name[1];
                } else if (m.name.length < maxNameLength) {
                    alignedName = m.name + '　'.repeat(maxNameLength - m.name.length);
                }
                otContent += `${alignedName}：${m.start}~${m.end}\n`;
            });
        }
        
        elements.previewOvertime.textContent = otContent;
    }

    async function handleCopy(text, btnElement) {
        try {
            await navigator.clipboard.writeText(text);
            const originalHTML = btnElement.innerHTML;
            btnElement.classList.add('success');
            btnElement.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> 已复制`;
            setTimeout(() => {
                btnElement.classList.remove('success');
                btnElement.innerHTML = originalHTML;
            }, 2000);
        } catch (err) {
            alert('复制失败，请手动长按文本框复制。');
        }
    }

    // --- Work Schedule Logic ---
    const K = 'schedule_base',
      K_C = 'schedule_custom',
      SCHED_T = new Date()
    SCHED_T.setHours(0, 0, 0, 0)
    let baseDate,
      baseWork,
      cur = new Date(SCHED_T),
      customDays = {}

    function fmtKey(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
    }

    function loadSchedule() {
      const d = localStorage.getItem(K)
      if (d) {
        const o = JSON.parse(d)
        baseDate = new Date(o.date)
        baseWork = o.work
      } else {
        baseDate = new Date(SCHED_T)
        baseWork = 1
      }
      baseDate.setHours(0, 0, 0, 0)

      const c = localStorage.getItem(K_C)
      if (c) {
        customDays = JSON.parse(c)
        let changed = false
        const todayStr = fmtKey(SCHED_T)
        for (let key in customDays) {
          if (key < todayStr) {
            delete customDays[key]
            changed = true
          }
        }
        if (changed) localStorage.setItem(K_C, JSON.stringify(customDays))
      }
    }

    function isW(d) {
      const diff = Math.round((d - baseDate) / 864e5)
      const mod = ((diff % 2) + 2) % 2
      return baseWork ? mod === 0 : mod !== 0
    }

    function getWorkStatus(d) {
      const y = d.getFullYear(),
        m = d.getMonth(),
        date = d.getDate()
      const firstDay = new Date(y, m, 1).getDay()
      const firstMonday = firstDay === 0 ? 2 : firstDay === 1 ? 1 : 9 - firstDay
      const secondMonday = firstMonday + 7

      if (date >= secondMonday && date <= secondMonday + 3) {
        const prevSunday = new Date(y, m, secondMonday - 1)
        const prevIsWork = isW(prevSunday)
        const offset = date - secondMonday
        return prevIsWork ? offset >= 2 : offset < 2
      }
      return isW(d)
    }

    function toggleDay(dateStr) {
      if (dateStr < fmtKey(SCHED_T)) return 
      if (customDays[dateStr]) delete customDays[dateStr]
      else customDays[dateStr] = true
      localStorage.setItem(K_C, JSON.stringify(customDays))
      renderSchedule()
    }

    function renderSchedule() {
      const y1 = cur.getFullYear(),
        m1 = cur.getMonth()
      const d2 = new Date(y1, m1 + 1, 1)
      const y2 = d2.getFullYear(),
        m2 = d2.getMonth()

      const f1 = new Date(y1, m1, 1),
        L1 = new Date(y1, m1 + 1, 0)
      const f2 = new Date(y2, m2, 1),
        L2 = new Date(y2, m2 + 1, 0)

      const el = document.getElementById('calendarContainer')
      if (!el) return;
      let h =
        '<div class="cal-head"><div class="cal-title">' + y1 + '年' + (m1 + 1) + '月 - ' + (y1 === y2 ? '' : y2 + '年') + (m2 + 1) + '月</div>'
      h +=
        '<div class="cal-nav"><button class="btn-t" onclick="goToday()">今天</button><button class="btn-a" onclick="go(-1)">‹</button><button class="btn-a" onclick="go(1)">›</button></div></div>'
      h +=
        '<div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days">'

      const todayStr = fmtKey(SCHED_T)

      function buildDay(y, m, i) {
        const dt = new Date(y, m, i)
        const dateStr = fmtKey(dt)
        let w = getWorkStatus(dt)
        const t = dt.getTime() === SCHED_T.getTime()
        const isM = customDays[dateStr]
        if (isM) w = !w 

        const canEdit = dateStr >= todayStr 
        let cls = 'd ' + (w ? 'w' : 'o') + (t ? ' t' : '') + (isM ? ' m' : '') + (canEdit ? ' edit' : '')
        let click = canEdit ? ` onclick="toggleDay('${dateStr}')"` : ''

        return `<div class="${cls}"${click}><span class="n">${i}</span><span class="g">${w ? '班' : '休'}</span></div>`
      }

      for (let i = 0; i < f1.getDay(); i++) h += '<div class="d empty"></div>'
      for (let i = 1; i <= L1.getDate(); i++) h += buildDay(y1, m1, i)

      const tail1 = 6 - L1.getDay()
      for (let i = 0; i < tail1; i++) h += '<div class="d empty"></div>'

      for (let i = 0; i < f2.getDay(); i++) h += '<div class="d empty"></div>'
      for (let i = 1; i <= L2.getDate(); i++) h += buildDay(y2, m2, i)

      h +=
        '</div><div class="legend"><span><i class="lw"></i>上班</span><span><i class="lo"></i>休息</span><span><i style="background:#faad14;border-radius:50%;width:8px;height:8px;margin:2px"></i>手动修改</span></div>'
      el.innerHTML = h
    }

    function go(n) {
      cur.setMonth(cur.getMonth() + n)
      renderSchedule()
    }
    function goToday() {
      cur = new Date(SCHED_T)
      renderSchedule()
    }

    function setDay(w) {
      const v = document.getElementById('setDate').value,
        msg = document.getElementById('msgSched')
      if (!v) {
        msg.className = 'msg-sched show err'
        msg.textContent = '请选择日期'
        return
      }
      baseDate = new Date(v)
      baseDate.setHours(0, 0, 0, 0)
      baseWork = w
      localStorage.setItem(K, JSON.stringify({ date: fmtKey(baseDate), work: w }))
      msg.className = 'msg-sched show ok'
      msg.textContent = '已设置 ' + v + ' 为' + (w ? '上班' : '休息') + '，后续日期已自动排布'
      renderSchedule()
    }

    function clearCustom() {
      customDays = {}
      localStorage.removeItem(K_C)
      const msg = document.getElementById('msgSched')
      msg.className = 'msg-sched show ok'
      msg.textContent = '已取消所有手动修改的日期'
      renderSchedule()
    }

    function clearScheduleData() {
      localStorage.removeItem(K)
      baseDate = new Date(SCHED_T)
      baseWork = 1
      const msg = document.getElementById('msgSched')
      msg.className = 'msg-sched show ok'
      msg.textContent = '基准数据已清除，已恢复默认设置'
      renderSchedule()
    }

    init();
</script>

</body>
</html>
